[project]
name = "ledger"
version = "0.1.0"
description = "Single-user training log: strength + Garmin endurance + unified load"
requires-python = ">=3.11"

# Dependency budget: 10 direct packages, hard ceiling (see BRIEF §3).
# Currently 5. Every addition needs a reason that survives 'will this still
# install in five years?'
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 0.3.5 fixed GHSA-wjhr-76vg-2hvc (token files written world-readable).
    # The 0.3 line dropped garth: tokens live in one file under GARMINTOKENS
    # and the old oauth1/oauth2 pair is refused, so moving a working install
    # onto it means running `ledger garmin-login` once more, from a terminal.
    "garminconnect>=0.3.5,<0.4",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.28",   # fastapi TestClient transport; not a runtime dependency
]
# `ledger.mcp_server` — the read API as MCP tools for a Claude session on the
# same machine. Runs on the host, outside the image; the image never needs it.
mcp = [
    "mcp>=1.20,<2",
    "httpx>=0.28",
]

[project.scripts]
ledger = "ledger.cli:main"
ledger-mcp = "ledger.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledger*"]

[tool.setuptools.package-data]
ledger = ["db/migrations/*.sql", "report/*.html", "web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"ledger/leagues.py" = ["RUF001"]  # scraped pages use en dashes in scores
"ledger/report/timeframe.py" = ["RUF001"]  # en dashes are intentional in date ranges
"tests/test_timeframe_alignment.py" = ["RUF001"]  # asserts those exact labels
