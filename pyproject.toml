[project]
name = "ledger"
version = "0.1.0"
description = "Single-user training log: strength + Garmin endurance + unified load"
requires-python = ">=3.11"

# Dependency budget: 10 direct packages, hard ceiling (see BRIEF §3).
# Currently 5. Every addition needs a reason that survives 'will this still
# install in five years?'
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Pinned to the garth-based 0.2 line, on purpose. The 0.3 line replaced
    # the OAuth1 session with a token minted by a password login, and that
    # login is answered 401 "invalid username or password" by Garmin's SSO
    # for this account while the OAuth1 tokens the 0.2 line resumes from keep
    # working (see python-garminconnect issue #332). The cost is
    # GHSA-wjhr-76vg-2hvc, token files written under the umask; here they sit
    # on a Docker volume owned by the unprivileged app user, which is the
    # same protection. `ledger/garmin/client.py` supports both lines, so the
    # day a 0.3 login succeeds the pin moves back to ">=0.3.5,<0.4" and
    # `ledger garmin-login` is run once.
    "garminconnect>=0.2.25,<0.3",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx>=0.28",   # fastapi TestClient transport; not a runtime dependency
]
# `ledger.mcp` — the read API as MCP tools for a Claude session on the
# same machine. Runs on the host, outside the image; the image never needs it.
mcp = [
    "mcp>=1.20,<2",
    "httpx>=0.28",
]

[project.scripts]
ledger = "ledger.cli:main"
ledger-mcp = "ledger.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledger*"]

[tool.setuptools.package-data]
ledger = ["db/migrations/*.sql", "report/*.html", "web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"ledger/leagues.py" = ["RUF001"]  # scraped pages use en dashes in scores
"ledger/report/timeframe.py" = ["RUF001"]  # en dashes are intentional in date ranges
"tests/test_timeframe_alignment.py" = ["RUF001"]  # asserts those exact labels
